services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: investmade_fun
      POSTGRES_USER: investmade_fun
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investmade_fun"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - investmade_postgres:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://investmade_fun:local-development-only@postgres:5432/investmade_fun
      PORT: 8787
    ports:
      - "8787:8787"
    command: ["sh", "-c", "npm run db:migrate && npm start"]

volumes:
  investmade_postgres:
